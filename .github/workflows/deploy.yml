name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4

      # everything in the repo ships except git/CI files, root-level docs (README, COPY, shelved) and editor config;
      # new asset folders are picked up without editing this file
      - name: Prepare site
        run: |
          rsync -a --exclude='.git*' --exclude='/*.md' --exclude='/.prettierrc.json' --exclude='/_site' ./ _site/
          # cache-bust css/js with this commit, so a deploy is never served stale
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
